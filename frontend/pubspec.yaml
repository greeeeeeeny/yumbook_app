name: yumbook_frontend
description: "Frontend Flutter app for YumBook"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  yumbook_shared:
    path: ../shared
  yumbook_backend:
    path: ../backend
  supabase_flutter: ^2.5.6
  intl: ^0.20.2
  provider: ^6.0.5
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.6
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.2
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700